<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wish Tree</title>
  <meta name="description" content="A Thanksgiving tree grown from everyone's wishes.">
  <meta name="theme-color" content="#1c1a48">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="scene">
    <div class="stage" id="stage">
      <svg id="world" role="img" aria-label="A tree made of wishes, growing on a small Earth at dusk"></svg>

    <header class="masthead">
      <h1>Wish Tree</h1>
      <p>Every wish becomes a branch.</p>
    </header>
  </main>
  <script type="module" src="js/main.js"></script>

</html>
